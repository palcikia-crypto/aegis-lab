name: probe-workers
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe workers
        run: |
          python3 - <<'PYEOF'
          import urllib.request, urllib.error
          for url in ["https://gemini-proxy.apigemenipp.workers.dev/",
                      "https://vless-ws-new.apigemenipp.workers.dev/"]:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      print(url, "->", r.status, r.read()[:150])
              except urllib.error.HTTPError as e:
                  print(url, "-> HTTP", e.code, e.read()[:150])
              except Exception as e:
                  print(url, "->", type(e).__name__, str(e)[:150])
          PYEOF
